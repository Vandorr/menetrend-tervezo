name: APK építése
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "README.md"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Rendszercsomagok
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev libltdl-dev build-essential
      - name: Buildozer telepítése
        run: pip install --upgrade buildozer "Cython==0.29.37" virtualenv
      - name: Maven-tükör (a Maven Central 429-cel korlátozza a futtatókat)
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/init.gradle <<'GRADLE'
          allprojects {
              buildscript { repositories { maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' } } }
              repositories { maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' } }
          }
          GRADLE
      - name: Gyorsítótár visszaállítása
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
            ~/.gradle/caches
          key: buildozer-${{ hashFiles('buildozer.spec') }}-${{ github.run_id }}
          restore-keys: buildozer-${{ hashFiles('buildozer.spec') }}-
      - name: APK építése (3 próbálkozásig)
        run: |
          for i in 1 2 3; do
            buildozer -v android debug && exit 0
            echo "Sikertelen próba: $i"; sleep 45
          done
          exit 1
      - name: Gyorsítótár mentése
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
            ~/.gradle/caches
          key: buildozer-${{ hashFiles('buildozer.spec') }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        with:
          name: menetrend-apk
          path: bin/*.apk
      - name: Kiadás a Releases oldalra (közvetlen APK-letöltés)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp bin/*.apk menetrend-tervezo.apk
          gh release create "build-${{ github.run_number }}" menetrend-tervezo.apk \
            --title "Menetrend tervező – build ${{ github.run_number }}" \
            --notes "APK Androidra. Telepítés: töltsd le a tabletre, nyisd meg, engedélyezd az ismeretlen forrásból telepítést."
