name: APK építése
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Rendszercsomagok
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev libltdl-dev build-essential
      - name: Buildozer telepítése
        run: pip install --upgrade buildozer "Cython==0.29.37" virtualenv
      - name: Gyorsítótár (SDK/NDK)
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}
      - name: APK építése
        run: buildozer -v android debug
      - uses: actions/upload-artifact@v4
        with:
          name: menetrend-apk
          path: bin/*.apk
